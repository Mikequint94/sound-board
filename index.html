<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publizity Soundboard</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <h1>Publizity Soundboard</h1>
  <div class="customize">
    <div class="color-picker">
      <label for="base">Color:</label>
      <input id="base" type="color" name="base" value="#FF02F0">
    </div>
    <div class="volume-select">
      <label for="volume">Volume:</label>
      <input id="volume" type="range" name="volume" min="10" max="99" value="50">
    </div>
  </div>
  <div class="row-container">
    <div class="keys row1">
      <button type="button" data-key="81" class="key" aria-label="Q: Binge Watch">
        <kbd>Q</kbd>
        <span class="sound">Binge Watch</span>
      </button>
      <button type="button" data-key="87" class="key" aria-label="W: Chunky Guys">
        <kbd>W</kbd>
        <span class="sound">Chunky Guys</span>
      </button>
      <button type="button" data-key="69" class="key" aria-label="E: That's Ameezing">
        <kbd>E</kbd>
        <span class="sound">That's Ameezing</span>
      </button>
      <button type="button" data-key="82" class="key" aria-label="R: Multiple Grapes">
        <kbd>R</kbd>
        <span class="sound">Multiple Rapes</span>
      </button>
      <button type="button" data-key="84" class="key" aria-label="T: Bangs">
        <kbd>T</kbd>
        <span class="sound">Bangs</span>
      </button>
      <button type="button" data-key="89" class="key" aria-label="Y: I got Baaaaangs">
        <kbd>Y</kbd>
        <span class="sound">I got Baaaaangs</span>
      </button>
      <button type="button" data-key="85" class="key" aria-label="U: Is that a Dig?">
        <kbd>U</kbd>
        <span class="sound">Is that a Dig?</span>
      </button>
      <button type="button" data-key="73" class="key" aria-label="I: It's these Bangs">
        <kbd>I</kbd>
        <span class="sound">It's these Bangs</span>
      </button>

    </div>

    <div class="keys row2">
      <button type="button" data-key="65" class="key" aria-label="A: Clap">
        <kbd>A</kbd>
        <span class="sound">clap</span>
      </button>
      <button type="button" data-key="83" class="key" aria-label="S: Hihat">
        <kbd>S</kbd>
        <span class="sound">hihat</span>
      </button>
      <button type="button" data-key="68" class="key" aria-label="D: Kick">
        <kbd>D</kbd>
        <span class="sound">kick</span>
      </button>
      <button type="button" data-key="70" class="key" aria-label="F: Openhat">
        <kbd>F</kbd>
        <span class="sound">openhat</span>
      </button>
      <button type="button" data-key="71" class="key" aria-label="G: Boom">
        <kbd>G</kbd>
        <span class="sound">boom</span>
      </button>
      <button type="button" data-key="72" class="key" aria-label="H: Ride">
        <kbd>H</kbd>
        <span class="sound">ride</span>
      </button>
      <button type="button" data-key="74" class="key" aria-label="J: Snare">
        <kbd>J</kbd>
        <span class="sound">snare</span>
      </button>
      <button type="button" data-key="75" class="key" aria-label="K: Tom">
        <kbd>K</kbd>
        <span class="sound">tom</span>
      </button>
      <button type="button" data-key="76" class="key" aria-label="L: Tink">
        <kbd>L</kbd>
        <span class="sound">tink</span>
      </button>
    </div>
    <div class="keys row3">
      <button type="button" data-key="32" class="key space" aria-label="Space: Background Beat (toggle)">
        <kbd>Space</kbd>
        <span class="sound">Background Beat</span>
      </button>
    </div>
  </div>


  <audio data-key="32" src="sounds/simplebeat.wav" preload="auto"></audio>
  <audio data-key="81" src="sounds/bingewatch.wav" preload="auto"></audio>
  <audio data-key="87" src="sounds/chunkyguys.wav" preload="auto"></audio>
  <audio data-key="69" src="sounds/ameezing.wav" preload="auto"></audio>
  <audio data-key="82" src="sounds/multiplegrapes.wav" preload="auto"></audio>
  <audio data-key="89" src="sounds/igotbangs.wav" preload="auto"></audio>
  <audio data-key="84" src="sounds/bangs.wav" preload="auto"></audio>
  <audio data-key="85" src="sounds/dig.wav" preload="auto"></audio>
  <audio data-key="73" src="sounds/itsthesebangs.wav" preload="auto"></audio>
  <audio data-key="65" src="sounds/clap.wav" preload="auto"></audio>
  <audio data-key="83" src="sounds/hihat.wav" preload="auto"></audio>
  <audio data-key="68" src="sounds/kick.wav" preload="auto"></audio>
  <audio data-key="70" src="sounds/openhat.wav" preload="auto"></audio>
  <audio data-key="71" src="sounds/boom.wav" preload="auto"></audio>
  <audio data-key="72" src="sounds/ride.wav" preload="auto"></audio>
  <audio data-key="74" src="sounds/snare.wav" preload="auto"></audio>
  <audio data-key="75" src="sounds/tom.wav" preload="auto"></audio>
  <audio data-key="76" src="sounds/tink.wav" preload="auto"></audio>

  <script src="./soundboard.js" defer></script>
</body>
</html>
